/* Cloud synchronization controls */
.cloud-state{display:flex;align-items:center;gap:7px;font-size:11px;color:#a8bfd2;white-space:nowrap;padding:8px 9px;border:1px solid rgba(140,188,222,.16);border-radius:10px;background:rgba(113,166,201,.05)}
.cloud-state .cloud-indicator{height:7px;width:7px;background:#93a6be;border-radius:50%;box-shadow:0 0 11px rgba(115,181,235,.3)}
.cloud-state[data-kind=online] .cloud-indicator{background:#67dbc0;box-shadow:0 0 12px rgba(80,228,189,.55)}
.cloud-state[data-kind=warning] .cloud-indicator{background:#ffc079;box-shadow:0 0 12px rgba(245,179,112,.5)}
.cloud-state[data-kind=busy] .cloud-indicator{background:#8cbbff;box-shadow:0 0 12px rgba(120,171,255,.55)}
.cloud-state:hover{background:rgba(113,166,201,.13)}
.cloud-input{width:100%;border:1px solid rgba(175,204,233,.22);border-radius:10px;padding:12px;background:#0b1726;color:#f1f7ff;outline:none}
.cloud-input:focus{border-color:#82cfff}.cloud-field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.cloud-field label{color:#acbdd0;font-size:12px;font-weight:700}.cloud-note{font-size:12px;line-height:1.8;color:#aabed4;margin:7px 0 12px}.cloud-kbd{font-family:Consolas,monospace;font-size:11px;overflow-wrap:anywhere;color:#c3e4f6}.cloud-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.cloud-actions button{padding:11px 14px;border-radius:9px;background:#152940;border:1px solid rgba(167,198,225,.26);color:#d9ebfd;font-size:12px;font-weight:700}.cloud-actions button.primary{background:#bce9ff;color:#081725}.cloud-actions button.danger{color:#ffbbc3;border-color:rgba(253,153,164,.28)}

/* ADsP ATLAS — local repair theme; no GitHub deployment */
:root{--bg:#242426;--surface:#313135;--panel:#303034;--text:#f4f4f7;--muted:#bfc0c6;--line:#505057;--accent:#bdbec8;--glow:transparent;--easing:cubic-bezier(.22,.75,.28,1)}

.top-action,.top-action.primary,.cloud-state{background:#3b3b40!important;border:1px solid #62626a!important;color:#f4f4f7!important;border-radius:10px;filter:none;box-shadow:none}

.top-action.primary{background:#57575e!important}
.cloud-state{display:flex;align-items:center;gap:7px;padding:10px}.cloud-state .cloud-indicator{background:#9daab2;box-shadow:none}.cloud-state[data-kind=online] .cloud-indicator{background:#a0bfa6;box-shadow:none}.cloud-state[data-kind=warning] .cloud-indicator{background:#d3ae7c;box-shadow:none}

<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-icon">✧</div><div><div class="brand-main">ADsP ATLAS</div><div class="brand-sub">LEARN BY CONNECTION</div></div></div>
    <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
    <div class="top-actions">
      <button class="cloud-state" id="cloudBtn" data-kind="offline" title="클라우드 동기화 상태"><span class="cloud-indicator"></span><span id="cloudStatus">클라우드 설정</span></button>
      <button class="top-action" id="homeBtn" title="전체 지도">⌂ <span>전체 지도</span></button>

      <button class="top-action primary" id="topAddBtn" title="하위 개념 추가">＋ <span>개념 추가</span></button>
    </div>
  </header>
  <main class="workspace">
    <section class="map-area" id="mapArea" aria-label="개념 마인드맵">
      <button class="mobile-detail-toggle" id="mobilePanelBtn">☰ 개념 설명</button>
      <div class="map-camera" id="mapCamera"><div class="map-viewport" id="viewport"><svg class="orbit-layer" id="orbits" aria-hidden="true"></svg><svg class="edge-layer" id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div>
      <div class="legend"><span>01&nbsp; 데이터 이해</span><span>02&nbsp; 분석 기획</span><span>03&nbsp; 데이터 분석</span></div>
      <div class="map-controls" role="group" aria-label="마인드맵 확대 축소">
        <button id="zoomInBtn" type="button" aria-label="지도 확대">+</button>
        <button id="zoomResetBtn" type="button" class="zoom-level" aria-label="전체 지도에 맞추기"><span id="zoomLevel">100%</span></button>
        <button id="zoomOutBtn" type="button" aria-label="지도 축소">−</button>
        <button id="zoomMinBtn" type="button" class="zoom-min-btn" title="펼친 전체 지도를 가장 작게 보기" aria-label="최대 축소">최소</button>
      </div>
    </section>
    <div class="panel-resizer" id="panelResizer" role="separator" aria-label="설명 영역 크기 조절" aria-orientation="vertical" aria-valuemin="20" aria-valuemax="80" aria-valuenow="35" tabindex="0" title="드래그로 설명 크기 변경 · 더블 클릭 시 기본값"><span class="resize-grip"></span></div>

      <div class="detail-footer"><button class="full-add" id="childAddBtn">＋ 이 개념 아래에 추가</button><div class="footer-hint">개념은 이 PC에 먼저 저장되며, 클라우드를 연결하면 동기화됩니다.</div></div>
    </aside>
  </main>
</div>

<script>
(()=>{'use strict';
const COLORS={root:'#78d7ff',a:'#57dbc3',b:'#f4ad78',c:'#ae9bff',cyan:'#78d7ff',rose:'#ff9eaf',yellow:'#f8dc8e',blue:'#83adff'};
const defaultNodes=[];const defaultLinks=[];let number=0;
function add(parent,title,icon,short,detail='',example='',exam='',memory='',priority='★★★',color=''){
 const p=defaultNodes.find(n=>n.id===parent);const id='n'+(++number);defaultNodes.push({id,parent,title,icon,short,detail,example,exam,memory,priority,color:color||(p?p.color:'root'),builtIn:true});return id;
}
const root=add(null,'ADsP','✧','데이터를 이해하고, 분석을 기획하고, 실제 분석으로 문제를 해결하는 전체 과정입니다.','개념을 따로 암기하지 말고 과목 → 주제 → 기법 순으로 연결해 보세요.','개념을 누르면 다음 단계가 펼쳐집니다.','합격 기준: 50문항 중 30문항 이상과 과목별 40% 이상.','전체 흐름 = 이해 → 기획 → 분석','★★★','root');
const a=add(root,'1과목 · 데이터 이해','◈','데이터 자체의 특징과 가치, 지식의 개념을 이해합니다.','DIKW, 데이터 유형, 빅데이터, 지식경영 등을 배우는 과목.','무엇이 데이터이고 왜 가치가 있는지 이해합니다.','총 10문항. 기본 개념·용어와 비교 문제를 중심으로 학습.','데이터란 무엇인가?','★★★','a');
const b=add(root,'2과목 · 분석 기획','◇','비즈니스 문제를 데이터 분석 과제로 바꾸고 실행 순서를 정합니다.','KDD·CRISP-DM·분석 과제 발굴·마스터플랜·거버넌스가 연결됩니다.','어떤 문제를 어떤 절차로 해결할지 결정합니다.','총 10문항. 방법론 순서와 유사 용어 구별에 집중.','문제를 어떻게 분석할까?','★★★','b');
const c=add(root,'3과목 · 데이터분석','✳','실제로 통계와 머신러닝으로 데이터를 분석하고 결과를 평가합니다.','통계, 가설검정, 회귀, 분류, 군집, 모델 성능평가를 다룹니다.','고객 이탈 예측 또는 이상 로그인 탐지 모델 만들기.','총 30문항. 출제 비중이 가장 크므로 가장 많이 학습.','통계 → 분석 기법 → 평가','★★★','c');
// 1과목
const a1=add(a,'DIKW','⬡','데이터가 정보·지식·지혜로 발전하는 단계입니다.','Data(사실) → Information(의미 부여) → Knowledge(패턴·규칙) → Wisdom(판단·활용).','30℃ → 어제보다 5℃ 높음 → 더우면 냉방 수요 증가 → 냉방 시설 미리 가동.','데이터·정보·지식·지혜의 순서 및 차이.','데 → 정 → 지 → 혜');
const a2=add(a,'데이터의 유형','◩','정성적은 종류와 특징, 정량적은 수량과 크기를 표현합니다.','정성적(범주형): 명목형·순서형. 정량적(수치형): 이산형·연속형. 숫자 코드라도 수량을 뜻하지 않으면 정성적일 수 있습니다.','혈액형은 정성적, 몸무게는 정량적, 만족도 1~5등급은 순서형.','문자냐 숫자냐보다 수량을 의미하는지에 주의.','정성 = 종류 / 정량 = 수량');
add(a2,'정성·정량','◌','정성적: 어떤 종류인가? 정량적: 얼마나 많은가?','정성적 데이터는 문자·범주 등으로 표현되며 비정형인 경우가 많습니다. 정량적 데이터는 수치로 나타내고 평균·분산 등의 통계 분석이 용이합니다.','직업=개발자(정성), 나이=27세(정량).','숫자로 표시된 우편번호는 수량이 아니므로 정성적 데이터.','정성=종류 / 정량=수량');
add(a2,'측정 척도','⊞','명목·서열·등간·비율척도는 데이터에 허용되는 비교와 계산이 다릅니다.','명목: 단순 구분. 서열: 순위 존재. 등간: 간격이 일정하지만 절대영점 없음. 비율: 간격 일정·절대영점 존재.','혈액형(명목), 성적등급(서열), 섭씨온도(등간), 몸무게(비율).','척도 순서: 명목 → 서열 → 등간 → 비율.','명서등비');

const studyEnhancements={"SECI 지식경영":["SECI 모델은 조직 내 지식이 사람 사이를 이동하고 새로운 지식으로 발전하는 과정을 설명하는 지식창출 이론입니다. 핵심은 개인의 머릿속 경험·감각 같은 암묵지와 매뉴얼·규칙·표처럼 명시적인 형식지가 서로 변환되는 것입니다. 직접 관찰하고 배우는 경험, 경험을 말과 문서로 표현하는 과정, 여러 문서를 결합하는 과정, 만들어진 매뉴얼을 실제로 연습하여 체득하는 과정이 순환할수록 조직의 지식이 축적됩니다. 단순 저장 기술이 아니라 조직의 학습과 공유 메커니즘을 설명합니다.","공통화(S): 암묵지→암묵지 · 함께 경험·관찰\n표출화(E): 암묵지→형식지 · 노하우 문서화\n연결화(C): 형식지→형식지 · 문서와 정보 통합\n내면화(I): 형식지→암묵지 · 실습으로 체득\n순서: 공통화→표출화→연결화→내면화"],"DIKW":["DIKW는 관찰된 사실이 어떻게 의사결정에 유용한 지혜로 바뀌는지 보여주는 계층적 사고 틀입니다. 데이터는 가공되지 않은 숫자나 기록이고, 정보는 맥락을 부여해 의미를 얻은 데이터입니다. 지식은 정보 사이의 패턴·원리·관계를 이해한 것이며, 지혜는 목적과 상황을 고려해 적절한 결정을 내리는 능력입니다. 각 단계는 단순히 데이터 양이 많아진다는 뜻이 아니라 해석과 활용의 수준이 달라지는 것입니다.","데이터(Data): 30℃\n정보(Information): 오늘 기온은 어제보다 5℃ 높다\n지식(Knowledge): 더운 날 냉음료 판매가 늘어나는 경향이 있다\n지혜(Wisdom): 오늘 냉음료 재고를 늘린다"],"분석 준비도":["분석 준비도는 조직이 데이터 분석을 제대로 수행할 수 있는 기반을 갖췄는지 평가하는 진단입니다. 실제로 분석을 얼마나 잘 활용하고 있는가를 묻는 성숙도와 구별해야 합니다. 전략과 분석 업무의 명확성, 담당할 조직과 사람, 사용할 기법, 충분한 데이터, 분석을 수용하는 문화, IT 인프라가 모두 영향을 줍니다. 준비도 결과로 분석 프로젝트를 시작하기 전에 무엇부터 보완할지 결정할 수 있습니다.","준비도 6영역: 분석 업무 / 인력·조직 / 분석 기법 / 분석 데이터 / 분석 문화 / IT 인프라\n준비도는 분석 수행 여건, 성숙도는 실제 활용 수준."],"분석 성숙도":["분석 성숙도는 조직이 데이터 분석을 실제 업무에서 어느 정도 체계적이고 넓게 활용하는지를 진단합니다. 일반적인 ADsP 학습 모형에서는 도입·활용·확산·최적화의 발전 단계로 구분합니다. 성숙도가 높다는 것은 도구를 많이 보유했다는 뜻보다 업무 전반에서 분석을 통해 개선과 혁신이 이루어지고 있음을 의미합니다. 준비도와 함께 보면 현재 역량과 필요한 투자의 방향을 파악할 수 있습니다.","도입→활용→확산→최적화\n도입: 시작 / 활용: 특정 업무 중심 / 확산: 조직 전반 확대 / 최적화: 분석 기반 지속 개선."],"가설검정":["가설검정은 모집단에 관한 주장에 대해 표본 자료가 얼마나 강한 반대 증거를 제시하는지 평가하는 절차입니다. 먼저 귀무가설 H₀와 대립가설 H₁을 정하고 검정통계량과 그 분포를 통해 p값을 계산합니다. p값은 H₀가 참이라고 가정했을 때 지금 관측한 결과 또는 더 극단적인 결과가 나올 가능성입니다. p값이 작으면 귀무가설을 기각할 근거가 됩니다. p값이 크다고 귀무가설이 참이라고 증명되는 것은 아닙니다.","p≤α: 귀무가설 기각 / p>α: 기각하지 못함\n제1종 오류: 실제 참인 H₀를 기각 / 제2종 오류: 실제 거짓인 H₀를 기각하지 못함.\n유의확률은 효과크기나 실무적 중요성과 다릅니다."],"회귀분석":["회귀분석은 하나 이상의 설명변수로 결과변수의 평균적 관계를 설명하거나 값을 예측하는 통계 방법입니다. 선형회귀의 계수는 다른 조건이 같을 때 설명변수가 한 단위 바뀌면 결과의 예측 평균이 어떻게 변하는지 나타냅니다. 잔차·결정계수·계수 유의성·다중공선성 등을 검토하여 모형을 해석합니다. 관찰자료의 회귀관계만으로 원인과 결과를 확정할 수는 없습니다.","단순선형회귀 ŷ=a+bX\n회귀계수 b: X 한 단위 변화에 따른 ŷ의 평균적 변화\nR²: 모형 설명력 / 잔차: 실제값−예측값 / VIF: 다중공선성 진단"],"연관분석":["연관분석은 거래나 사건 기록에서 둘 이상의 항목이 함께 나타나는 패턴을 발견합니다. 대표적인 장바구니 규칙 A→B는 A가 일어났을 때 B가 얼마나 자주 함께 나타나는지 서술하는 관계이지 원인을 뜻하지는 않습니다. 규칙은 지지도·신뢰도·향상도로 평가하고, Apriori나 FP-Growth로 빈발 항목을 찾을 수 있습니다.","지지도=동시 발생 건수/전체 거래\n신뢰도=동시 발생 건수/A 발생 건수\n향상도=신뢰도/P(B)\n향상도 >1: 양의 연관, =1: 독립 수준, <1: 음의 연관."],"모델 평가":["모델 평가는 학습에 쓴 데이터에서의 적합도가 아니라 새로운 데이터에서 모델이 목적에 맞게 작동하는지를 판단하는 과정입니다. 분류에는 혼동행렬·정밀도·재현율·ROC-AUC 등을 사용하고, 회귀에는 MAE·MSE·RMSE 등의 오차 지표가 쓰입니다. 클래스 불균형, 오탐과 미탐의 비용, 검증 데이터의 독립성에 따라 적합한 평가 지표가 달라집니다.","정확도=(TP+TN)/전체\n정밀도=TP/(TP+FP)\n재현율=TP/(TP+FN)\n특이도=TN/(TN+FP)\nF1=2PR/(P+R)\n평가는 데이터 누수·과적합을 경계해야 합니다."],"앙상블":["앙상블은 하나의 예측 모델에만 의존하지 않고 여러 모델의 결과를 결합하는 머신러닝 접근입니다. 배깅은 여러 표본에서 독립적으로 학습해 분산을 낮추고, 부스팅은 앞선 학습의 부족한 부분을 순차적으로 개선하며, 스태킹은 여러 모델의 예측을 입력받는 별도 메타 모델을 사용합니다. 서로 비슷한 모델을 늘린다고 반드시 좋아지는 것은 아니며 모델 간 다양성과 검증 방법이 중요합니다.","배깅: 독립 학습·병렬 결합 / 부스팅: 순차적으로 손실·오류 보완 / 스태킹: 메타 모델 학습.\n모든 부스팅이 오분류 샘플 가중치만 직접 높이는 것은 아닙니다."],"시계열분석":["시계열분석은 시간 순서로 관측된 자료의 구조를 분석하고 미래 값을 예측하는 방법입니다. 값들의 순서가 중요하며 추세, 계절성, 장기적인 순환, 예측하기 어려운 불규칙 변동을 구분합니다. 시점 간 의존성·정상성·차분 여부를 살펴 적절한 시계열 모형을 선택합니다.","추세: 장기적 상승·하락 / 계절: 일정 주기 반복 / 순환: 길이가 고정되지 않은 경기 변동 / 불규칙: 우연한 변동.\n정상성·ARIMA·차분을 함께 학습합니다."],"군집분석":["군집분석은 미리 정해진 정답 없이 데이터들을 특성의 유사성에 따라 여러 집단으로 묶습니다. 지도학습의 분류처럼 정답 범주를 예측하는 것이 아니라 데이터 내부의 구조를 탐색하는 비지도학습입니다. K-means는 중심과의 거리를, 계층적 군집은 순차적 결합 관계를, DBSCAN은 밀도를, 혼합분포군집은 확률적 소속을 활용합니다.","K-means: 중심 거리·K 미리 지정 / 계층적: 덴드로그램 / DBSCAN: 밀도·잡음 / 혼합분포·EM: 확률적 소속"]};
for(const node of defaultNodes){const item=studyEnhancements[node.title];if(item){node.detail=item[0];node.exam=item[1];}}
const qualitativeQuantitativeLesson={
 short:'정성적 데이터는 범주·특성을, 정량적 데이터는 측정 가능한 수량을 표현한다. 숫자 표기와 정량 여부는 다르다.',
 detail:'■ 무엇이 다른가?\n정성적 데이터는 종류·상태·의견·의미를 설명한다. 직업, 혈액형, 후기 글, 만족도 등급이 예다. 숫자로 부여된 학번·우편번호도 수량이 아니라 구분자이므로 정성적이다.\n정량적 데이터는 개수·길이·시간·금액처럼 크기를 측정하거나 계산할 수 있다. 구매 횟수·몸무게·매출이 예다. 이산형은 셀 수 있는 값, 연속형은 범위 내 실수로 측정되는 값이다.\n\n■ 정성/정량과 정형/비정형은 별개의 분류다\n정성·정량은 값의 의미, 정형·반정형·비정형은 저장·표현 구조를 구별한다. 정성 자료가 비정형인 경우가 많아도, 고객의 성별·직업을 표 형태의 정형 데이터로 저장할 수 있다. 정량 수치도 비정형 문장 속에 등장할 수 있다.\n\n■ 비용·분석 기술·활용\n교재에서는 정성적 비정형 자료가 자연어 처리·의미 해석·전처리 때문에 분석 비용과 기술 요구가 상대적으로 높을 수 있다고 설명한다. 반면 정량 자료는 구조화·집계·통계적 비교 및 대규모 일반화에 유리한 편이다. 하지만 데이터 종류·상황에 따라 비용과 난도는 역전될 수 있으므로 절대 규칙으로 외우지 않는다.\n\n■ 데이터의 두 가지 특성\n존재적 특성은 관찰·측정한 객관적 사실로 존재한다는 뜻이다. 당위적 특성은 관계를 살펴 추론과 예측의 근거로 활용할 수 있다는 뜻이다.',
 exam:'[선택지별 OX 판단 훈련]\n가. 정량 데이터가 정성 데이터보다 항상 분석 비용과 고도 기술을 요구한다 → X. 일반적인 교재의 경향은 오히려 정성적 비정형 데이터의 처리 난도가 더 높을 수 있다는 것. 단, 항상이라는 일반화도 주의.\n나. 정성적 데이터는 문자·언어로 표현되고 비정형인 경우가 많다 → O. 다만 모든 정성 데이터가 비정형인 것은 아님.\n다. 정성적 데이터는 구체적인 수치이며 저장·분석이 쉬운 편이다 → X. 정량적 특징을 뒤바꿔 서술.\n라. 정량적 데이터는 구조화된 형태에서 대규모 수집·집계·일반화에 유리하다 → O. 정량 데이터가 반드시 정형이어야 하는 것은 아님.\n마. 데이터는 사실이라는 존재적 특성과 추론·예측에 쓰이는 당위적 특성을 가진다 → O.\n\n[혼동 주의]\n정성≠항상 비정형 / 정량≠항상 정형 / 숫자 코드≠정량 / 데이터 관련성≠인과관계.',
 example:'쇼핑몰 고객 데이터: 직업=개발자(정성·정형), 후기=배송이 늦어요(정성·비정형), 주문 금액=45,000원(정량·정형). 직업과 후기를 집계하려면 부호화·텍스트 처리가 필요할 수 있고 금액은 평균·분산·추세를 바로 계산하기 쉽다.'
};

const studyLegacyContent={"DIKW":{"detail":"Data(사실) → Information(의미 부여) → Knowledge(패턴·규칙) → Wisdom(판단·활용).","exam":"데이터·정보·지식·지혜의 순서 및 차이."},"SECI 지식경영":{"detail":"암묵지: 경험으로 습득한 노하우. 형식지: 문서·매뉴얼 등으로 표현된 지식. SECI는 공통화→표출화→연결화→내면화 순서입니다.","exam":"4단계 방향을 정확히 암기하세요."},"분석 준비도":{"detail":"6영역: 분석 업무 파악, 분석 인력·조직, 분석 기법, 분석 데이터, 분석 문화, IT 인프라.","exam":"준비도는 6개 평가 영역."},"분석 성숙도":{"detail":"도입 → 활용 → 확산 → 최적화의 4단계. 3개 평가 부문은 비즈니스, 조직·역량, IT입니다.","exam":"성숙도=4단계, 평가 부문=3가지."},"가설검정":{"detail":"귀무가설(H0)은 기본 가정, 대립가설(H1)은 입증하고 싶은 주장. p값과 유의수준 α를 비교해 판단합니다.","exam":"일반적으로 p ≤ α면 귀무가설 기각."},"회귀분석":{"detail":"단순선형회귀: Y=a+bX. b는 X가 1단위 증가할 때 예측 Y의 변화량. 관계가 있다고 바로 인과를 뜻하지는 않습니다.","exam":"단순=독립변수 1개, 다중=2개 이상."},"시계열분석":{"detail":"추세·계절·순환·불규칙 요인으로 시계열을 분해할 수 있습니다.","exam":"계절과 순환의 주기 특성을 구별."},"군집분석":{"detail":"분할적 군집(K-means), 계층적 군집, 밀도 기반(DBSCAN), 혼합분포군집 등이 있습니다.","exam":"분류와 달리 그룹 정답이 주어지지 않음."},"연관분석":{"detail":"장바구니 분석에서 Apriori, FP-Growth를 이용하며 지지도·신뢰도·향상도를 평가합니다.","exam":"연관=함께 등장 / 군집=비슷한 것끼리."},"앙상블":{"detail":"배깅은 여러 모델을 독립 학습, 부스팅은 오류를 보완하며 순차 학습, 스태킹은 예측 결과를 다시 학습합니다.","exam":"K-means와 KNN은 앙상블 자체가 아님."},"모델 평가":{"detail":"혼동행렬의 TP·TN·FP·FN으로 정확도·오분류율·정밀도·재현율·특이도 등을 계산합니다.","exam":"오분류율=1−정확도, 정밀도·재현율의 분모 차이."}};
const studyNewConcepts=[{"parent":"데이터의 유형","title":"정형·반정형·비정형","short":"데이터가 저장되고 구조화된 방식을 구별하는 분류입니다.","detail":"정형 데이터는 표·스키마처럼 일정한 구조가 있고, 반정형은 JSON·XML처럼 항목을 구분하는 키와 태그가 있으나 고정된 관계형 테이블 구조가 필수는 아닙니다. 비정형은 본문·이미지·음성처럼 정해진 스키마 없이 표현됩니다. 정성·정량 분류는 값의 성격, 정형·비정형 분류는 저장 구조의 성격이므로 두 축을 동일시하면 안 됩니다.","exam":"정형: 관계형 테이블 / 반정형: JSON·XML·일부 로그 / 비정형: 이미지·자유서술. 로그도 형식에 따라 정형 또는 반정형이 될 수 있습니다.","example":"웹 서비스는 주문내역(SQL), API 응답(JSON), 고객 문의 글(텍스트)을 함께 분석합니다.","priority":"★★★"},{"parent":"데이터베이스","title":"데이터베이스 4대 특성","short":"통합·저장·운영·공용 데이터를 말합니다.","detail":"통합 데이터는 중복을 통제하여 일관성을 유지하고, 저장 데이터는 컴퓨터 매체에 기록됩니다. 운영 데이터는 조직의 업무에 실제 사용되어 지속적으로 갱신되며, 공용 데이터는 여러 사용자와 업무가 함께 사용할 수 있도록 관리됩니다.","exam":"통합(중복 통제) / 저장(기록) / 운영(업무 활용·갱신) / 공용(공동 사용). 운영 데이터는 고정 데이터와 다릅니다.","example":"쇼핑몰의 주문 DB를 고객지원·물류·정산팀이 공용으로 활용합니다.","priority":"★★★"},{"parent":"데이터베이스","title":"데이터 독립성","short":"데이터 구조의 변화가 프로그램에 미치는 영향을 줄이는 설계 원칙입니다.","detail":"물리적 독립성은 저장 장치·인덱스 등의 변경이 논리 구조에 미치는 영향을 줄이는 성질이고, 논리적 독립성은 개념 스키마 변경이 외부 뷰·응용 프로그램에 미치는 영향을 줄이는 성질입니다. 어떠한 변경에도 영향이 전혀 없다는 뜻은 아닙니다.","exam":"물리적: 내부 스키마 변경 → 개념 스키마 영향 최소화 / 논리적: 개념 스키마 변경 → 외부 스키마 영향 최소화.","example":"데이터 파일을 다른 디스크로 옮겨도 고객 조회 기능을 바꾸지 않도록 구성합니다.","priority":"★★★"},{"parent":"데이터베이스","title":"OLTP·OLAP","short":"운영 거래 처리와 분석용 처리를 구별합니다.","detail":"OLTP는 일상적인 주문·입금·재고 갱신처럼 짧고 빈번한 트랜잭션을 신속·정확하게 처리합니다. OLAP은 여러 기간과 관점에서 집계·비교·추세를 탐색해 의사결정을 지원합니다. 각각의 시스템은 운영 목적과 최적화 방향이 다릅니다.","exam":"OLTP=거래·갱신 중심 / OLAP=분석·집계 중심. OLTP를 대규모 다차원 분석만의 기술로 설명하면 틀립니다.","example":"주문 결제는 OLTP, 월별 매출과 지역별 상품 분석은 OLAP을 활용합니다.","priority":"★★★"},{"parent":"빅데이터 3V·4V","title":"빅데이터 활용 3요소","short":"데이터·기술·인력의 조합이 있어야 분석 가치가 생깁니다.","detail":"충분하고 적절한 데이터만으로는 성과를 보장할 수 없습니다. 대용량 자료를 수집·처리할 기술, 문제를 정의하고 결과를 해석할 인력과 역량이 함께 필요합니다. 실제 조직에서는 절차와 윤리·보안도 중요하지만 시험에서 자주 쓰는 기본 3요소와 구분합니다.","exam":"데이터 / 기술 / 인력. 활용 요소와 3V·4V(데이터 특성)를 혼동하지 않습니다.","example":"쇼핑몰 데이터를 수집하고 분산처리 도구로 분석하며 담당자가 캠페인에 적용합니다.","priority":"★★★"},{"parent":"빅데이터 3V·4V","title":"가치 패러다임 변화","short":"디지털화에서 연결, 지능형 대리·자동화로 확장되는 관점입니다.","detail":"디지털화는 기존 업무와 정보를 전산 데이터로 바꾸는 단계이고, 연결은 다양한 데이터·사람·사물의 정보가 결합되어 새 가치를 만드는 단계입니다. 에이전시는 연결된 데이터를 바탕으로 시스템이 추천·판단·대리 행동을 수행하는 단계입니다.","exam":"디지털화 → 연결 → 에이전시(Agency). 3V·4V 특성과는 서로 다른 분류입니다.","example":"종이 영수증 전산화 → 구매·재고 정보 연결 → 자동 재고 발주 추천으로 발전합니다.","priority":"★★★"},{"parent":"빅데이터 위기","title":"가명처리·익명화","short":"개인정보 활용 위험을 줄이는 서로 다른 처리 개념입니다.","detail":"가명처리는 추가 정보 없이는 개인을 알아볼 수 없도록 처리하지만 재식별 가능성을 완전히 제거하지 않습니다. 익명처리는 합리적으로 고려할 수 있는 수단을 이용하더라도 더 이상 개인을 알아볼 수 없도록 하는 것을 목표로 합니다. 기술적 처리뿐 아니라 결합 위험과 최신 법적 요건을 함께 고려해야 합니다.","exam":"가명정보는 개인정보 보호 법령상 일정한 조건에서 여전히 개인정보입니다. 익명정보와 동일하다고 쓰면 부정확합니다.","example":"고객 ID를 별도 키로 대체해 통계를 만들고 재식별 가능성을 평가합니다.","priority":"★★★"},{"parent":"데이터 사이언스","title":"하드스킬·소프트스킬","short":"데이터를 분석하는 기술과 결과를 실제 업무로 연결하는 역량입니다.","detail":"하드스킬은 통계, 수학, 프로그래밍, 분석 알고리즘, 데이터 처리 같은 기술적 전문성입니다. 소프트스킬은 문제 정의, 의사소통, 협업, 비판적 사고, 스토리텔링 등 실무 상황에서 지식을 활용하고 설득하는 능력입니다. 데이터 시각화는 기술 구현과 전달 역량이 함께 작용할 수 있습니다.","exam":"하드=분석 기술 / 소프트=문제해결·협업·전달. 모든 항목이 둘 중 하나에 배타적으로 속하는 것은 아닙니다.","example":"분석가가 고객 이탈 모형을 만들고 담당자에게 비용·효과를 설명합니다.","priority":"★★★"},{"parent":"데이터 사이언스","title":"기업 정보시스템","short":"기업 업무 목적에 따라 서로 다른 정보를 수집·활용합니다.","detail":"CRM은 고객 관계와 구매 이력, ERP는 재무·인사·물류 등 전사 자원, SCM은 공급망과 제품 흐름을 관리하는 시스템입니다. 이름보다 관리 대상과 업무 목적을 기준으로 구분해야 합니다.","exam":"CRM=고객 관계 / ERP=기업 자원 / SCM=공급망.","example":"고객별 구매 이력으로 재구매 캠페인을 설계할 때 CRM 자료를 사용합니다.","priority":"★★★"},{"parent":"과제 발굴 방식","title":"분석 주제 4분면","short":"분석 대상과 분석 방법을 알고 있는지에 따라 네 가지 과제로 나뉩니다.","detail":"과제가 무엇을 분석하는지(대상)를 아는지와 어떤 방법으로 해결할지(방법)를 아는지를 두 축으로 구분합니다. 최적화는 대상·방법을 모두 알고 있고, 솔루션은 대상은 알지만 방법이 불확실합니다. 통찰은 방법은 있으나 어떤 문제에 쓸지 탐색하며, 발견은 대상과 방법을 모두 탐색하는 경우입니다.","exam":"대상 O·방법 O=최적화 / O·X=솔루션 / X·O=통찰 / X·X=발견.","example":"매출 예측 대상과 알고리즘이 정해져 있다면 최적화형 분석 과제입니다.","priority":"★★★"},{"parent":"과제 우선순위","title":"분석 과제 난이도·가치","short":"가치와 실현 가능성을 함께 고려해 수행 순서를 정합니다.","detail":"분석 과제를 비교할 때 예상 비즈니스 효과만이 아니라 데이터 확보, 기술 난이도, 비용, 조직 역량, 적용 시급성도 평가합니다. 가치가 높더라도 실행할 수 없는 과제보다 먼저 구축 가능한 과제를 선택할 수 있습니다.","exam":"비즈니스 가치와 실행 난이도는 서로 다른 평가축입니다.","example":"적은 비용으로 이탈 고객을 조기 탐지하는 과제를 우선 추진합니다.","priority":"★★★"},{"parent":"데이터 거버넌스","title":"데이터 품질관리","short":"데이터가 목적에 맞게 정확하고 일관되게 사용되도록 관리합니다.","detail":"품질관리는 단순한 오류 검사가 아니라 요구 수준·기준을 정하고 측정·점검·개선하는 전 과정입니다. 정확성, 완전성, 일관성, 유효성, 적시성 등 데이터의 특성을 업무 맥락에 맞게 판단합니다.","exam":"정확성(값이 맞는가) / 완전성(빠짐없는가) / 일관성(서로 모순 없는가) / 적시성(제때 최신인가).","example":"여러 지점 고객 주소 데이터의 누락과 표기 불일치를 주기적으로 점검합니다.","priority":"★★★"},{"parent":"분석 성숙도","title":"분석 조직 유형","short":"분석 전담 조직을 어떤 방식으로 운영하는지에 따른 구조입니다.","detail":"집중형은 전문 인력을 한곳에 모아 분석 역량을 축적하기 좋지만 현업 적용과 소통이 늦을 수 있습니다. 기능형은 개별 부서가 각자 분석하여 현업 밀착에 유리하지만 중복과 표준화 문제가 생기기 쉽습니다. 분산형은 중앙 분석 조직과 현업 부서에 분석 인력을 배치해 장점을 결합하려는 구조입니다.","exam":"집중형=중앙 전담 / 기능형=각 부서 독자 / 분산형=중앙과 현업 연계. 조직 유형 명칭은 교재 정의를 함께 확인합니다.","example":"고객·물류 부서에 분석 인력을 배치하되 공통 분석 표준은 중앙에서 관리합니다.","priority":"★★★"},{"parent":"기초통계","title":"왜도·첨도","short":"분포의 비대칭성과 꼬리·뾰족함 등의 모양을 요약합니다.","detail":"왜도는 분포가 어느 방향으로 비대칭인지 측정하는 통계량입니다. 양의 왜도는 오른쪽 꼬리가 길고 음의 왜도는 왼쪽 꼬리가 긴 경향을 나타냅니다. 첨도는 정규분포와 비교한 꼬리의 두꺼움 등 분포 모양에 관련됩니다. 표본이 달라지면 평균·중앙값·최빈값 순서는 항상 고정되지 않습니다.","exam":"양의 왜도=오른쪽 긴 꼬리 / 음의 왜도=왼쪽 긴 꼬리. 평균>중앙값이라는 조건만으로 모든 분포의 왜도를 확정할 수는 없습니다.","example":"대부분은 소액 구매하지만 일부 초고액 주문이 있는 매출 분포는 오른쪽 꼬리가 길 수 있습니다.","priority":"★★★"},{"parent":"기초통계","title":"표본추출·표준오차","short":"표본에서 추정한 값이 얼마나 흔들리는지 설명합니다.","detail":"표본평균은 표본을 다시 뽑을 때마다 달라지며, 그 분포의 표준편차를 표준오차(SE)라고 합니다. 모집단 표준편차가 σ이고 독립·동일분포 표본 크기가 n이면 표본평균 표준오차는 σ/√n입니다. 복원·비복원 추출 여부와 유한모집단 조건에 따라 보정이 필요할 수 있습니다.","exam":"표준편차=개별 관측값의 변동 / 표준오차=추정량의 표본 간 변동. n이 4배가 되면 표준오차는 대체로 1/2배.","example":"설문 표본 100명과 400명일 때 평균 추정의 불확실성을 비교합니다.","priority":"★★★"},{"parent":"확률·분포","title":"조건부확률·베이즈 정리","short":"어떤 사건을 알고 난 뒤 다른 사건의 확률을 갱신합니다.","detail":"조건부확률 P(A|B)=P(A∩B)/P(B)이며 P(B)>0이어야 합니다. 베이즈 정리는 P(A|B)=P(B|A)P(A)/P(B)로, 사전확률에 관측 자료의 가능도를 반영해 확률을 갱신합니다. 독립사건이라면 P(A|B)=P(A)입니다.","exam":"P(A|B)와 P(B|A)는 일반적으로 같지 않습니다. 확률의 분모와 조건을 확인합니다.","example":"보안 경보가 발생했을 때 실제 계정 탈취일 확률을 기본 발생률과 탐지 정확도로 갱신합니다.","priority":"★★★"},{"parent":"가설검정","title":"신뢰구간","short":"표본으로 모수를 추정할 때 불확실성을 범위로 표현합니다.","detail":"95% 신뢰구간은 같은 표집과 계산 절차를 매우 많이 반복하면 만들어지는 구간 중 약 95%가 참 모수를 포함한다는 뜻입니다. 고정된 한 구간이 참 모수를 95% 확률로 포함한다고 해석하는 빈도주의 설명은 부정확합니다.","exam":"대표 형태: 추정치 ± 임계값×표준오차. 신뢰수준 95%와 p값 0.05는 같은 의미가 아닙니다.","example":"고객 평균 구매금액을 5만 원으로 추정하며 오차 범위를 제시합니다.","priority":"★★★"},{"parent":"가설검정","title":"t검정·대응표본","short":"평균 차이가 우연한 표본 변동으로 설명될 수 있는지 검정합니다.","detail":"일표본 t검정은 한 집단의 평균이 특정 기준과 다른지, 독립표본 t검정은 독립인 두 집단의 평균을 비교하며, 대응표본 t검정은 동일 대상의 전후처럼 짝을 이룬 관측값의 차이를 비교합니다. 독립표본의 분산이 같다고 가정하지 않을 때는 Welch t검정이 유용합니다.","exam":"일표본 / 독립표본 / 대응표본을 구분. 대응표본은 관측치의 짝이 핵심이며 두 집단 이름만 보고 판단하지 않습니다.","example":"같은 학생의 교육 전·후 시험 점수 차이는 대응표본 t검정으로 분석합니다.","priority":"★★★"},{"parent":"가설검정","title":"모수·비모수 검정","short":"분포에 대한 가정과 데이터 특성에 따라 검정 방법을 선택합니다.","detail":"모수검정은 모집단 분포나 모수 구조에 대한 가정을 활용하고, 비모수검정은 순위·부호 등을 이용해 비교적 약한 분포 가정으로 분석하는 방법이 많습니다. 표본 수가 작다는 이유만으로 무조건 비모수검정을 선택하는 것은 아닙니다.","exam":"정규성·독립성·측정 척도·연구 목적 확인. 대응표본 비모수 예: Wilcoxon 부호순위 검정.","example":"극단값이 많고 서열척도인 만족도 점수를 비교할 때 순위 기반 검정을 고려합니다.","priority":"★★★"},{"parent":"회귀분석","title":"결정계수 R²","short":"회귀모형이 종속변수 변동을 얼마나 설명하는지 보여주는 지표입니다.","detail":"보통 절편이 포함된 최소제곱 선형회귀에서 R²=1−SSE/SST로, 전체 변동 중 모형이 설명한 비중을 나타냅니다. 독립변수를 추가하면 일반적으로 R²가 감소하지 않으므로 변수가 많은 모형 비교에는 수정 결정계수를 함께 검토합니다.","exam":"R²가 높아도 인과관계가 증명되거나 미래 예측 성능이 반드시 좋다는 뜻은 아닙니다.","example":"시험 성적에서 공부시간을 사용한 회귀모형의 설명력을 확인합니다.","priority":"★★★"},{"parent":"회귀분석","title":"잔차·MSE·RMSE","short":"관측값과 예측값의 차이로 회귀모형을 진단합니다.","detail":"잔차 eᵢ=yᵢ−ŷᵢ입니다. 잔차 패턴은 선형성·등분산성·이상치 문제를 발견하는 데 도움을 줍니다. 예측 평가 지표 MSE는 보통 오차 제곱의 평균(1/n)Σ(y−ŷ)²이며, 회귀 오차분산의 불편추정량은 잔차제곱합을 자유도(n−p)로 나눈 MS_error입니다. 둘의 분모는 문맥에 따라 다릅니다.","exam":"MSE(예측오차 평균)와 ANOVA 회귀 잔차평균제곱(MS_error)을 혼동하지 않습니다. RMSE=√MSE.","example":"아파트 가격 예측에서 실제 가격과 예측 가격의 차이를 분석합니다.","priority":"★★★"},{"parent":"회귀분석","title":"다중공선성·VIF","short":"독립변수끼리 강하게 관련되어 회귀계수 추정이 불안정해지는 현상입니다.","detail":"다중공선성은 설명변수들 사이의 높은 선형관계 때문에 회귀계수의 표준오차가 커지고 개별 영향력을 구분하기 어려워지는 문제입니다. VIF=1/(1−R²ⱼ)는 j번째 설명변수를 나머지 설명변수로 회귀했을 때의 결정계수로 계산합니다.","exam":"VIF=1이면 해당 선형 중복이 없고, 값이 클수록 다중공선성 가능성이 큽니다. 5·10 등의 기준은 상황별 경험적 기준이지 절대 법칙은 아닙니다.","example":"광고비와 노출수가 거의 같이 움직일 때 변수별 회귀계수가 불안정해질 수 있습니다.","priority":"★★★"},{"parent":"회귀분석","title":"로지스틱 회귀·오즈비","short":"범주형 결과의 확률을 추정하는 회귀 기반 분류기법입니다.","detail":"이진 로지스틱 회귀는 확률 p의 로짓 log[p/(1−p)]을 독립변수의 선형결합으로 표현합니다. 회귀계수 β를 지수화한 exp(β)는 다른 조건이 같을 때 해당 변수 1단위 증가에 따른 오즈의 배수를 뜻합니다. 확률 자체가 같은 배수로 변한다는 뜻은 아닙니다.","exam":"연결함수=로짓 / 역연결함수=시그모이드. exp(β)=오즈비(OR).","example":"로그인 위험요인의 변화가 계정 탈취 가능성의 오즈에 어떻게 관련되는지 해석합니다.","priority":"★★★"},{"parent":"분산분석 ANOVA","title":"F검정·사후검정","short":"여러 집단의 평균 차이를 분산비로 검정합니다.","detail":"분산분석은 집단 간 변동과 집단 내 변동을 비교하며 F=MS_between/MS_within을 사용합니다. 유의한 F검정은 적어도 한 집단 평균이 다를 수 있다는 근거이지 어느 집단끼리 다른지까지 말해주지 않습니다. 이때 사후검정으로 쌍별 비교를 합니다.","exam":"F통계량이 크면 집단 간 차이의 근거가 커질 수 있습니다. 다중비교를 할 때는 오류율 보정이 필요합니다.","example":"세 가지 광고 캠페인의 평균 매출 차이가 있는지 검정합니다.","priority":"★★★"},{"parent":"시계열분석","title":"정상성·차분","short":"시간에 따라 통계적 성질이 크게 바뀌지 않도록 시계열을 다룹니다.","detail":"약정상성은 평균과 분산이 시점에 의존하지 않고 자기공분산이 시간 차이에만 의존하는 성질입니다. 추세가 있는 시계열은 차분으로 변화량을 분석하여 정상성을 개선할 수 있습니다. 로그 변환은 주로 분산 안정화에 도움을 줄 수 있으나 추세를 자동으로 제거하지는 않습니다.","exam":"1차 차분 Δyₜ=yₜ−yₜ₋₁. 로그 변환과 차분의 목적을 구분합니다.","example":"꾸준히 증가하는 일별 가입자 수에서 전날 대비 변화량을 분석합니다.","priority":"★★★"},{"parent":"시계열분석","title":"ARIMA 모형","short":"자기회귀·차분·이동평균을 결합한 시계열 예측 모형입니다.","detail":"ARIMA(p,d,q)는 AR(자기회귀) 차수 p, 차분 횟수 d, MA(이동평균) 차수 q로 구성됩니다. 과거 값과 예측오차의 구조를 이용하며, 차분을 통해 비정상 시계열을 정상에 가깝게 만든 뒤 모형화합니다. 단, 모든 시계열에 ARIMA가 최선은 아닙니다.","exam":"p=AR 차수 / d=차분 차수 / q=MA 차수. 단순 이동평균 평활화와 MA 확률과정은 개념이 다릅니다.","example":"지난 2년의 월별 매출을 사용해 다음 달 매출을 예측합니다.","priority":"★★★"},{"parent":"군집분석","title":"군집 개수·덴드로그램","short":"계층적 군집을 나무 모양 도표로 해석합니다.","detail":"덴드로그램은 관측값 또는 군집들이 어떤 거리에서 합쳐지는지 보여줍니다. 특정 높이에 수평선을 그었을 때 잘리는 가지 수가 그 기준에서의 군집 수가 됩니다. 그림에 수평 기준이 없다면 군집 개수를 하나로 고정할 수 없습니다.","exam":"거리와 결합 높이, 자르는 위치를 함께 확인합니다. 원본 그림이 누락되면 정답을 단정하지 않습니다.","example":"고객을 유사도에 따라 순차적으로 묶고 적절한 군집 수를 탐색합니다.","priority":"★★★"},{"parent":"모델 평가","title":"ROC·AUC","short":"분류 임계값을 바꿀 때 탐지율과 오탐률의 관계를 평가합니다.","detail":"ROC는 가로축 FPR=FP/(FP+TN), 세로축 TPR=TP/(TP+FN)을 그린 곡선입니다. AUC는 ROC 아래 면적으로, 점수가 임의의 양성 샘플을 음성보다 높게 순위 매길 가능성과 관련됩니다. 정확도 하나로 모든 임계값의 성능을 판단하지 않도록 도와줍니다.","exam":"ROC의 세로축=재현율, 가로축=1−특이도. AUC가 높아도 실제 적용 임계값·비용을 검토해야 합니다.","example":"이상 로그인 탐지 임계값을 조절하며 탐지율과 오탐률의 균형을 비교합니다.","priority":"★★★"},{"parent":"모델 평가","title":"교차검증·홀드아웃","short":"학습 데이터 바깥에서도 모델이 잘 작동하는지 평가합니다.","detail":"홀드아웃은 학습·검증·시험 데이터를 분리하는 방법입니다. K겹 교차검증은 학습 데이터를 K개 구간으로 나누어 각 구간을 차례로 검증에 사용합니다. 데이터 누수 방지를 위해 전처리의 학습도 각 훈련 구간 내부에서 해야 합니다.","exam":"홀드아웃·교차검증은 성능 추정과 모형 선택에 도움을 주지만 과적합을 자동으로 제거하는 마법 같은 기법은 아닙니다.","example":"고객 이탈 데이터를 5개 폴드로 나눠 여러 후보 모형의 평균 성능을 비교합니다.","priority":"★★★"},{"parent":"모델 평가","title":"과적합·편향·분산","short":"학습 점수와 실제 예측 성능의 차이를 설명합니다.","detail":"과적합은 훈련 데이터의 우연한 잡음까지 학습해 새로운 데이터에서 성능이 떨어지는 현상입니다. 높은 편향은 너무 단순한 모형에서, 높은 분산은 데이터 변화에 민감한 복잡한 모형에서 흔히 나타납니다. 규제·교차검증·데이터 확대·조기 종료 등으로 조절할 수 있습니다.","exam":"훈련 오차는 낮고 검증 오차가 높으면 과적합을 의심. 다만 측정·데이터 누수 여부도 확인합니다.","example":"고객별 구매를 외워버린 모형보다 일반적인 패턴을 익힌 모형을 선택합니다.","priority":"★★★"},{"parent":"회귀분석","title":"Ridge·Lasso 규제","short":"계수 크기를 제한해 과적합과 불안정성을 줄이는 회귀 기법입니다.","detail":"Ridge는 손실함수에 계수 제곱합(L2)을 벌점으로 더해 계수를 줄입니다. Lasso는 계수 절댓값 합(L1)을 더해 일부 계수를 정확히 0으로 만들 수 있으므로 변수 선택에도 활용됩니다. 변수 스케일과 규제 강도를 함께 검토해야 합니다.","exam":"Ridge=L2, Lasso=L1. 어느 방법이나 모든 상황에서 성능 향상을 보장하지는 않습니다.","example":"수백 개 광고 변수 중 중요한 변수를 골라 판매량을 예측합니다.","priority":"★★★"},{"parent":"연관분석","title":"Apriori·FP-Growth","short":"빈발 항목집합을 찾아 연관규칙을 만드는 방법입니다.","detail":"Apriori는 빈발 항목집합의 모든 부분집합도 빈발해야 한다는 성질을 이용해 후보 집합을 단계적으로 줄입니다. FP-Growth는 FP-tree에 거래를 압축해 후보 생성 부담을 줄이는 방식입니다. 연관규칙의 유용성은 지지도·신뢰도·향상도로 평가합니다.","exam":"Apriori의 하향 폐쇄성: 드문 항목집합의 모든 상위집합도 빈발하지 않습니다.","example":"장바구니에서 우유와 빵을 함께 구매하는 패턴을 찾아 상품 배치를 개선합니다.","priority":"★★★"},{"parent":"R·전처리","title":"주성분분석 PCA","short":"관련된 여러 변수를 소수의 새로운 축으로 요약하는 차원축소 기법입니다.","detail":"PCA는 원래 변수의 선형결합으로 서로 직교하는 주성분을 만들고, 앞쪽 성분부터 가능한 큰 분산을 설명하도록 합니다. 보통 변수 단위가 다르면 표준화가 중요합니다. 주성분 개수는 원래 변수 수 및 자료 행렬의 랭크를 넘을 수 없고, 중심화된 n개 관측치에서는 0이 아닌 주성분이 최대 min(p,n−1)개입니다.","exam":"PCA는 기본적으로 정답 레이블을 이용하지 않는 비지도 차원축소. 주성분=선형결합, 분산 최대.","example":"서로 관련된 고객 소비 지표 20개를 소수의 요약 지표로 바꿉니다.","priority":"★★★"},{"parent":"R·전처리","title":"결측치·이상치 처리","short":"분석 전에 누락된 값과 극단값의 원인을 점검합니다.","detail":"결측값은 MCAR·MAR·MNAR처럼 발생 메커니즘이 다를 수 있으며, 삭제·평균/중앙값 대체·모형 기반 대체 등 여러 방법이 있습니다. 이상치는 입력 오류일 수도 있고 실제 중요한 사건일 수도 있으므로 무조건 제거하면 안 됩니다.","exam":"결측치 처리에 정답 하나가 있는 것은 아닙니다. 훈련·검증 데이터 분리 전에 전체 데이터로 평균을 학습하면 누수가 생길 수 있습니다.","example":"매출 이상값이 결제 오류인지 실제 대량 주문인지 확인하고 처리합니다.","priority":"★★★"},{"parent":"앙상블","title":"랜덤 포레스트","short":"여러 의사결정나무의 예측을 결합하는 배깅 계열 기법입니다.","detail":"각 나무는 보통 부트스트랩 표본으로 훈련되고 노드 분할 시 일부 변수 후보를 무작위로 고려해 나무 간 상관을 낮춥니다. 분류는 다수결, 회귀는 평균 등으로 결과를 결합합니다. 단일 나무보다 분산을 줄이는 데 도움이 될 수 있습니다.","exam":"랜덤 포레스트=배깅+변수 무작위 선택. 부스팅처럼 앞 나무의 오답만 순차적으로 수정하는 방식이 아닙니다.","example":"고객 이탈을 예측할 때 여러 나무의 판단을 합쳐 안정성을 높입니다.","priority":"★★★"},{"parent":"분류분석","title":"로지스틱 회귀 분류","short":"연속적인 점수 대신 범주에 속할 확률을 예측합니다.","detail":"로지스틱 회귀는 이름에 회귀가 있지만 이진분류에도 널리 쓰입니다. 선형예측값을 시그모이드로 변환하여 0~1 사이 확률을 추정하고 임계값으로 범주를 판정합니다. 로지스틱 회귀 모형의 계수는 확률 변화량이 아니라 로그오즈 변화를 나타냅니다.","exam":"로지스틱 회귀는 지도학습의 분류 모델. 회귀모형·오즈비와 함께 이해합니다.","example":"거래가 정상인지 사기인지의 확률을 예측합니다.","priority":"★★★"}];
studyNewConcepts.push(...[{"parent":"데이터베이스","title":"데이터베이스의 구조와 독립성","short":"데이터를 체계적으로 관리하여 여러 응용이 일관되게 이용하도록 하는 저장·관리 체계입니다.","detail":"데이터베이스는 단순한 자료의 모음이 아니라 통합·공용·운영·저장의 특성을 갖도록 관리하는 데이터 집합이다. 통합 데이터는 불필요한 중복을 통제하고, 저장 데이터는 전산 매체에 기록하며, 공용 데이터는 여러 사용자가 공유하고, 운영 데이터는 업무 수행 중 갱신된다. DBMS가 무결성·동시성·접근통제 등을 관리한다.","exam":"데이터 독립성은 물리적 저장구조 또는 논리적 구조의 변화가 관련 응용에 미치는 영향을 최소화하는 성질이다. 모든 변경이 응용에 전혀 영향을 주지 않는다는 절대적 보장은 아니다.\n통합·저장·공용·운영은 데이터베이스의 대표 특징이다. '고정된 데이터'라는 표현은 틀리다.\n데이터 무결성=정확하고 일관된 상태 유지; 데이터 독립성=구조 변경 영향 완화.","example":"회원정보를 여러 부서가 공동 조회하지만 갱신 권한은 역할에 따라 제한한다.","priority":"★★★"},{"parent":"데이터의 유형","title":"데이터의 존재적·당위적 특성","short":"데이터의 형태와 의미, 그 데이터가 판단에 쓰이는 방식을 구별하는 개념입니다.","detail":"데이터의 존재적 특성은 관찰·측정으로 확보한 개별 사실의 측면이고, 당위적 특성은 사실 사이의 관계를 통해 추론·예측의 근거가 되는 측면을 가리킨다. 정성·정량 구분은 표현하는 내용의 성격이며, 정형·비정형 구분은 구조의 일정함이라는 별개의 축이다.","exam":"정성 데이터가 모두 비정형인 것은 아니다. 정량 데이터도 센서 시계열·자유 형식 로그처럼 서로 다른 형식을 가진다.\n정성=범주·의미 중심, 정량=측정 가능한 수치 중심. 원문 분석 비용의 차이는 데이터 구조·품질·도구에 따라 달라지는 경향일 뿐 절대 법칙이 아니다.","example":"배송 후기(정성)와 구매횟수(정량)를 함께 고객 분석에 사용한다.","priority":"★★★"},{"parent":"빅데이터 위기","title":"위험과 대응 방안 구별","short":"빅데이터 활용에는 사생활 침해, 책임 원칙 훼손, 데이터 오용 위험이 수반됩니다.","detail":"사생활 침해는 개인을 식별하거나 행동을 추론할 위험, 책임 원칙 훼손은 자동화된 판단 때문에 의사결정 책임을 불명확하게 만드는 위험, 데이터 오용은 편향되거나 목적에 맞지 않는 분석을 부당하게 적용하는 위험이다. 기술적 통제와 조직·법적 책임 체계를 함께 마련해야 한다.","exam":"위험: 사생활 침해·책임 원칙 훼손·데이터 오용.\n보호 수단: 익명화·가명처리·접근제어·영향평가·설명가능성.\n'동의에서 책임으로'라는 교재 표현은 사전동의의 법적 의무가 없어졌다는 뜻이 아니다.","example":"고객 신용점수 자동화에 설명·이의제기 절차를 마련한다.","priority":"★★★"},{"parent":"데이터 사이언스","title":"데이터 사이언티스트의 역량","short":"데이터 분석을 비즈니스 문제 해결과 연결하려면 기술 능력과 소통 능력이 함께 필요합니다.","detail":"데이터 사이언스는 문제 정의, 데이터 수집·정제, 탐색적 분석, 통계·머신러닝 모델링, 평가, 결과 전달까지 포함한다. 하드스킬은 통계·수학·알고리즘·프로그래밍·데이터 처리 역량이고, 소프트스킬은 도메인 통찰, 소통, 설득, 협업 능력이다. 알고리즘의 피해 구제와 감사를 전담하는 알고리즈미스트는 별도 역할로 설명되며, 모든 데이터 사이언티스트의 필수 법률 직무는 아니다.","exam":"EDA=분포·이상치·변수 간 관계 탐색. 데이터 전처리=결측·오류·중복·이상치 처리.\n모델 개발 능력은 하드스킬, 결과 스토리텔링은 소프트스킬.\n예측 성능과 인과적 설명은 구분한다.","example":"수요 예측 결과를 현업 관리자에게 설명해 발주량 의사결정을 돕는다.","priority":"★★★"},{"parent":"빅데이터 3V·4V","title":"빅데이터 활용의 3요소와 가치 패러다임","short":"데이터·기술·인력의 결합으로 빅데이터가 가치를 만들고 활용 방식이 진화합니다.","detail":"빅데이터를 활용하려면 다루어야 할 데이터 자원, 저장·분석·AI 기술, 분석을 수행하고 판단할 인력이 필요하다. 가치 패러다임은 디지털화(Digitalization) → 연결(Connection) → 에이전시(Agency)로 설명한다. 먼저 아날로그 정보를 디지털 데이터로 바꾸고, 이를 연결한 뒤, 복잡한 연결에서 지능형 시스템이 작업을 대리한다.","exam":"3요소=데이터·기술·인력. 프로세스도 실제 운영에 중요하지만 교재의 '3대 기본요소' 목록과는 구분한다.\nDigitalization → Connection → Agency. 에이전시는 정보의 단순 수집보다 자동화된 판단·수행에 무게를 둔다.","example":"매장 POS 데이터 → 온라인 재고 통합 → 발주 추천 에이전트.","priority":"★★★"},{"parent":"과제 발굴 방식","title":"분석 주제 발굴 4분면","short":"분석 대상(What)과 분석 방법(How)을 아는지에 따라 분석 과제를 네 유형으로 구분합니다.","detail":"비즈니스에서 무엇을 분석할지 명확한지와 어떤 방법으로 분석할지 확보되어 있는지를 나누면 과제 도출 방식이 달라진다. 대상과 방법을 모두 알면 최적화, 대상은 알지만 방법이 불명확하면 솔루션, 방법은 알지만 대상을 특정하지 못하면 통찰, 둘 다 불확실하면 발견이다.","exam":"최적화=What O·How O / 솔루션=What O·How X / 통찰=What X·How O / 발견=What X·How X.\n방법론이나 기법 자체를 모른다는 말과 과제를 정의하지 못했다는 말을 구별한다.","example":"고객 이탈 문제는 정했지만 어떤 분석법을 쓸지 몰라 솔루션 유형의 탐색을 시작한다.","priority":"★★★"},{"parent":"CRISP-DM","title":"데이터 이해와 데이터 준비의 역할 차이","short":"분석 프로젝트에서 데이터가 무엇을 담고 있는지 파악하는 일과 모델 입력을 만드는 일을 구분합니다.","detail":"CRISP-DM은 업무 이해 → 데이터 이해 → 데이터 준비 → 모델링 → 평가 → 전개의 여섯 단계다. 데이터 이해에서는 초기 자료 수집, 자료 기술, 탐색, 품질 확인으로 내용과 문제를 파악한다. 데이터 준비에서는 필요한 자료 선택, 정제, 통합, 파생변수 생성, 형식 변환으로 모델링용 데이터셋을 만든다. 실제 현장에서는 이해·준비 작업을 반복하기도 한다.","exam":"데이터 탐색은 주로 데이터 이해 단계의 활동. 데이터 정제·통합·포맷팅은 데이터 준비의 대표 활동.\n이해와 준비의 경계가 현실에서 완전히 배타적인 것은 아니며 방법론의 주된 목적을 묻는 시험 문제에서 구분한다.","example":"고객 로그를 먼저 탐색해 오류율을 파악한 뒤 누락값을 처리하고 구매 빈도를 파생변수로 만든다.","priority":"★★★"},{"parent":"과제 우선순위","title":"시급성과 난이도","short":"성과가 크더라도 데이터 확보·구현 비용이 높으면 순서와 추진 방식을 조정해야 합니다.","detail":"분석 과제의 시급성은 전략적 중요도, 목표 가치, 추진 필요 시점 등 비즈니스 측면에 초점이 있다. 난이도는 분석 기술 복잡성, 데이터 수집·저장·가공의 비용, 시스템 활용 조건, 인력 숙련도 등 구현 측면을 따진다. 우선순위는 이 두 축을 함께 검토한다.","exam":"시급성≠데이터 양. 데이터 양·가공 비용 등은 일반적으로 난이도 쪽 변수다.\n전략적 중요도가 높으면 시급성이 높게 평가될 수 있으나 모든 기업에서 자동으로 결정되지는 않는다.","example":"매출 손실이 큰 고객 이탈 분석을 우선하되 데이터 확보가 어렵다면 작은 범위의 파일럿을 먼저 진행한다.","priority":"★★★"},{"parent":"분석 성숙도","title":"준비도와 성숙도 결합","short":"준비도는 분석할 기반의 충분함, 성숙도는 실제 분석 활용이 얼마나 발전했는지를 진단합니다.","detail":"분석 성숙도는 도입 → 활용 → 확산 → 최적화의 단계로 살펴본다. 준비도는 인력·조직·분석 기법·데이터·문화·IT 인프라 등 분석을 실행할 기반을 확인한다. 두 관점을 교차해 조직의 현재 위치와 개선 과제를 도출한다. 경쟁사와 비교할 수 있지만 핵심 목적은 자사의 분석 수준을 진단하고 발전 방향을 설계하는 데 있다.","exam":"준비형=준비도 낮음·성숙도 낮음 / 도입형=준비도 높음·성숙도 낮음 / 정착형=준비도 낮음·성숙도 높음 / 확산형=준비도 높음·성숙도 높음.\n'정착형은 준비도가 높다'라고 일반화하지 않는다.","example":"분석 도구는 갖췄지만 업무 활용이 적은 부서는 도입형 특성이 있다.","priority":"★★★"},{"parent":"데이터 거버넌스","title":"데이터 거버넌스의 운영 체계","short":"조직 전체가 같은 기준으로 데이터를 정의·관리·사용하도록 하는 의사결정과 책임 체계입니다.","detail":"데이터 거버넌스는 원칙, 담당 조직, 관리 프로세스를 정해 데이터 품질과 표준·보안을 통제하는 활동이다. 데이터 표준화에는 표준 용어·명명 규칙·코드 체계·데이터 사전이 포함된다. 관리 체계는 책임자와 권한을 정하며 저장소 관리와 표준 준수 점검·개선도 지속적으로 수행한다.","exam":"원칙·조직·프로세스는 대표 구성 요소.\n거버넌스는 정책만 만들고 종료하는 프로젝트가 아니다. 표준 준수 평가와 변경 관리를 반복해야 한다.\n'운용 비용'은 고려해야 할 관리 항목일 수 있지만 전통적인 체계 구성 요소 목록과 혼동하지 않는다.","example":"부서별 '고객ID' 명칭과 코드체계를 통일하고 데이터 사전에 등록한다.","priority":"★★★"}]);
studyNewConcepts.push(...[{"parent":"기초통계","title":"상자그림과 IQR","short":"사분위수와 중앙값으로 분포를 요약하고 잠재적 이상값을 찾는 그림","detail":"상자 하단과 상단은 제1사분위수 Q1과 제3사분위수 Q3, 내부 선은 중앙값이다. IQR=Q3−Q1로 자료의 중간 50%에 해당하는 값의 구간 폭을 구한다. 일반적인 수염은 1.5IQR 이내 최극단 관측치까지 표시하며, 그 밖의 점은 잠재적 이상값이다.","exam":"IQR 하한 Q1−1.5IQR, 상한 Q3+1.5IQR. 이상값은 무조건 오류가 아니다. 상자의 크기만으로 전체 표본 수를 판단할 수 없다.","example":"학급별 점수의 중앙값과 산포를 비교한다.","priority":"★★★"},{"parent":"R·전처리","title":"이상값과 표준오차 구분","short":"개별 이상값과 표본평균의 불확실성은 서로 다른 개념","detail":"이상값 탐지에는 IQR, Z 점수, 정규분포를 가정한 3시그마 규칙, 거리·밀도 기반 방법을 사용할 수 있다. 표준오차 SE는 추정량이 표본마다 얼마나 변하는지 나타내며 개별 관측치를 이상값으로 판정하는 임계값이 아니다.","exam":"표준편차=관측값 산포, 표준오차=통계량의 표집 변동성. 이상값은 원인 확인 후 유지·변환·대체·삭제한다.","example":"이상 매출을 무조건 삭제하지 않고 특별행사 여부를 점검한다.","priority":"★★★"},{"parent":"가설검정","title":"카이제곱 교차분석","short":"범주형 변수의 빈도를 통해 관련성이나 분포 차이를 검사","detail":"카이제곱 검정은 범주형 자료의 관측빈도와 기대빈도 차이를 검토한다. 적합도 검정은 하나의 분포, 독립성 검정은 두 범주형 변수의 관계, 동질성 검정은 집단별 범주 분포 비교에 사용한다.","exam":"검정통계량=Σ(관측−기대)²/기대. 연속형 데이터는 구간화 없이 그대로 범주형 교차표에 넣지 않는다. 기대빈도 조건에 주의한다.","example":"고객 연령대와 구매 여부의 독립성을 분석한다.","priority":"★★★"},{"parent":"상관분석","title":"상관계수의 선형변환","short":"변수에 상수를 더하거나 양수를 곱해도 Pearson 상관계수는 같다","detail":"상관계수는 두 변수의 선형적 관련성을 표준화한 값이며 −1부터 +1까지 갖는다. a,c가 0이 아닌 경우 Corr(aX+b,cY+d)=sign(ac)Corr(X,Y). 두 변수에 각각 음수를 곱하면 부호 반전이 두 번 일어나므로 값이 유지된다.","exam":"Corr(X,Y)=0.5이면 Corr(2X,Y)=0.5, Corr(X+0.3,Y+0.2)=0.5, Corr(−X,−2Y)=0.5. 상관은 인과를 보장하지 않는다.","example":"섭씨 온도를 화씨 온도로 바꿔도 양수 배율이므로 다른 변수와의 상관계수는 동일하다.","priority":"★★★"},{"parent":"회귀분석","title":"잔차 패턴과 회귀 진단","short":"모형의 관측값과 예측값 차이를 살펴 가정 위반 가능성을 진단","detail":"잔차는 실제값−예측값이다. 잔차가 0을 중심으로 규칙 없이 분포하는지, 예측값에 따라 산포가 달라지지 않는지 확인한다. 곡선 패턴은 빠진 비선형 관계, 깔때기 형태는 이분산 가능성을 시사하며 그 원인은 추가로 검증해야 한다.","exam":"설명변수 간 상관이 높으면 다중공선성을 의심하지만 모형 전체 적합도를 그것 하나로 판정할 수 없다. 잔차도만 보고 Ridge·Lasso가 정답이라고 판단하지 않는다.","example":"광고비-매출 잔차가 곡선이면 제곱항을 검토한다.","priority":"★★★"},{"parent":"회귀분석","title":"로짓 연결함수와 시그모이드","short":"로지스틱 회귀의 선형식은 확률 자체가 아니라 로그오즈를 설명한다","detail":"로지스틱 회귀의 연결함수는 로짓 g(p)=ln[p/(1−p)]이다. 시그모이드 1/(1+e^(−z))는 로그오즈를 확률로 바꾸는 역연결함수다. 다른 설명변수를 고정했을 때 계수 β만큼 로그오즈가 증가하고 오즈비는 exp(β)이다.","exam":"오즈=p/(1−p). 오즈비 2와 확률 2배는 다르다. 로짓과 시그모이드를 동일한 연결함수라고 하면 틀리다.","example":"합격 여부를 예측하고 공부시간 계수를 오즈비로 해석한다.","priority":"★★★"},{"parent":"모델 평가","title":"F1 점수","short":"정밀도와 재현율을 함께 평가하는 조화평균","detail":"F1=2PR/(P+R)=2TP/(2TP+FP+FN)이다. 클래스 불균형에서 정확도만 높아지는 문제를 보완할 수 있지만 참음성(TN)은 직접 반영하지 않는다. 비용과 목적에 따라 정밀도·재현율·PR-AUC를 함께 검토해야 한다.","exam":"Precision=TP/(TP+FP), Recall=TP/(TP+FN). P=0.8, R=0.5이면 F1≈0.615. 한 지표로 모든 불균형 문제를 객관적으로 평가할 수 있는 것은 아니다.","example":"사기 탐지에서 놓치는 거래와 잘못 막는 거래 간 균형을 평가한다.","priority":"★★★"},{"parent":"모델 평가","title":"훈련·검증·평가 데이터","short":"모형의 학습과 조정, 최종 성능 측정을 구분하여 데이터 누수를 줄인다","detail":"훈련 세트에서 모델의 계수를 학습하고 검증 세트에서 하이퍼파라미터와 임계값을 고른다. 테스트 세트는 최종 일반화 성능 평가에 사용하며 튜닝 단계에 반복적으로 사용하지 않는다. 전처리의 평균·표준편차도 훈련 자료에서 계산해야 한다.","exam":"정해진 60:20:20 같은 분할 비율은 절대 규칙이 아니다. 소량 자료는 교차검증을 활용하고 시계열은 시간순 분할을 우선 검토한다.","example":"훈련 데이터로 모델을 만들고 검증 데이터로 깊이를 정한 뒤 테스트 데이터로 최종 평가한다.","priority":"★★★"},{"parent":"확률·분포","title":"여사건을 활용한 결측률","short":"하나라도 조건을 만족하는 비율은 둘 다 아닌 사건의 확률을 빼서 계산","detail":"두 변수의 결측 사건 A,B가 독립이고 각각 결측확률 0.1이면 모두 정상인 확률은 0.9×0.9=0.81이다. 따라서 하나라도 결측일 비율은 1−0.81=0.19다. 독립이 아니라면 교집합을 따로 구해야 한다.","exam":"P(A∪B)=P(A)+P(B)−P(A∩B). 독립할 때 P(A∩B)=P(A)P(B). 독립 조건 없이 19%를 단정하지 않는다.","example":"이름과 성별에 각각 독립적으로 10% 결측이 있으면 행 삭제 비율은 19%다.","priority":"★★★"}]);
studyNewConcepts.push(...[{"parent":"데이터 사이언스","title":"유전 알고리즘","short":"생물 진화를 흉내 내어 좋은 해를 반복적으로 찾는 최적화 방법입니다.","detail":"후보 해를 개체(염색체)로 표현하고 적합도 평가→선택→교차→돌연변이→새 세대 평가를 반복한다. 지도학습 분류나 군집화 자체가 아니라 최적해 탐색에 쓰는 진화적 계산 방식이다.","exam":"47회 7번: 자동차 설계안을 여러 세대에 걸쳐 최적화하는 사례는 유전 알고리즘. 군집분석은 비슷한 대상을 묶는 비지도 분석이므로 목적이 다르다.","example":"설계 변수의 조합 중 비용이 낮고 성능이 좋은 자동차 부품 설계를 찾는다.","priority":"★★"},{"parent":"데이터 사이언스","title":"감정분석","short":"문장에 담긴 긍정·부정·중립 등 감정이나 태도를 분석하는 텍스트 분석입니다.","detail":"리뷰나 게시물 텍스트를 전처리하고 사전 기반 규칙 또는 지도학습·언어모델로 감정 범주를 예측한다. 문서분류에 해당할 수 있지만 감정분석이라는 과제와 군집분석이라는 목적은 다르다.","exam":"47회 7번: '고객 리뷰를 긍정·부정으로 구분'은 감정분석. 감정분석이 항상 한 종류의 알고리즘만을 의미하지는 않는다.","example":"배송 후기에서 불만이 급증한 원인을 찾는다.","priority":"★★"},{"parent":"데이터 사이언스","title":"사회관계망 분석 SNA","short":"사람·조직 같은 개체를 노드, 관계를 연결선으로 보고 구조를 분석하는 방법입니다.","detail":"친구·팔로우·거래 같은 관계를 그래프로 표현하고 연결 중심성, 매개 중심성, 근접 중심성, 군집 구조를 분석한다. 관계 자체를 데이터로 다룬다는 점에서 개체의 특성 벡터로 비슷한 것을 묶는 일반 군집분석과 구분된다.","exam":"47회 7번: SNS 사용자 관계를 네트워크로 시각화하는 작업은 SNA. 차트 시각화만이 분석의 전부는 아니다.","example":"정보가 빠르게 퍼지는 핵심 계정이나 연결 고리 계정을 찾는다.","priority":"★★"},{"parent":"시계열분석","title":"정상성·백색잡음","short":"정상성은 시간이 지나도 통계적 성질이 안정적인 상태, 백색잡음은 예측 가능한 자기상관이 거의 없는 불규칙 신호입니다.","detail":"약정상성: 평균 일정, 분산 일정, 자기공분산은 절대 시점이 아닌 시차에만 의존. 백색잡음은 평균 0, 일정한 유한 분산, 서로 다른 시차의 자기공분산 0인 과정이다. 백색잡음은 약정상이며 반드시 서로 독립이라는 조건까지 요구하지는 않는다. ARIMA 잔차가 백색잡음에 가까우면 모형의 남은 시간 패턴이 크지 않다는 단서다.","exam":"47회 36·40번: 백색잡음을 비정상이라고 하면 오답. 자기상관이 시간이 흐르며 감소하는 것이 정상성의 필수 조건은 아니다. 추세는 차분, 분산 불안정은 변환을 고려한다.","example":"매출 시계열을 차분한 뒤 잔차에 자기상관이 남아 있는지 확인한다.","priority":"★★★"},{"parent":"상관분석","title":"스피어만·켄달 순위상관","short":"측정값보다 순위를 비교해 두 변수의 단조 관계를 살펴보는 상관 측도입니다.","detail":"Pearson은 선형관계를, Spearman은 각 변수에 매긴 순위의 Pearson 상관으로 단조 증가·감소 관계를 평가한다. Kendall τ는 관측값 쌍의 순서가 일치하는지 불일치하는지로 관계를 측정한다. 스피어만은 모든 비선형 모양을 포착하지 못하며 U자형처럼 비단조적인 관계에서는 약할 수 있다.","exam":"47회 37번: 비선형 중 단조 관계를 포착하는 지표는 스피어만. 코사인 유사도는 벡터 방향, 자카드는 집합 교집합/합집합.","example":"만족도 순위와 재구매 순위가 함께 상승하는지 확인한다.","priority":"★★★"},{"parent":"딥러닝","title":"활성화 함수 비교","short":"신경망의 가중합을 변환하여 비선형성을 만드는 함수들이며 출력 범위와 목적이 다릅니다.","detail":"Sigmoid: 1/(1+e^(−z)), 출력 (0,1)로 이진분류 확률에 자주 사용. tanh: (e^z−e^(−z))/(e^z+e^(−z)), 출력 (−1,1). ReLU: max(0,z), 은닉층에서 자주 사용. Softmax: 각 점수 e^zi/Σ e^zj, 여러 클래스 확률 합 1. 은닉층 없는 선형식+시그모이드의 이진모형은 로지스틱 회귀와 같은 형태다.","exam":"47회 41·43번: 다범주 확률 소프트맥스, 이진 로지스틱 시그모이드, 음수도 출력하는 tanh, 음수를 0으로 만드는 ReLU를 식으로 구별한다.","example":"손글씨 숫자 10종을 분류하는 모델 최종층에 softmax를 사용한다.","priority":"★★★"},{"parent":"군집분석","title":"자기조직화지도 SOM","short":"고차원 입력을 저차원 격자에 배치하면서 비슷한 입력을 가까운 뉴런에 학습시키는 비지도 신경망입니다.","detail":"각 데이터에 가장 유사한 승자 뉴런(BMU)을 찾은 다음 승자와 주변 뉴런의 가중치를 갱신하는 경쟁 학습을 반복한다. 입력 데이터의 근접 관계·위상(topology)을 가능한 유지하는 데 목적이 있다. 격자 뉴런별 할당 데이터 수가 동일하게 제한되지 않는다.","exam":"47회 47번: SOM은 군집화·시각화에 이용되지만 모든 격자 노드에 같은 수의 데이터가 배정되지는 않는다. K-means와 달리 이웃 뉴런도 갱신한다.","example":"상품 고객 특성 데이터를 2차원 격자로 배치해 유사 고객 영역을 살펴본다.","priority":"★★"},{"parent":"기초통계","title":"표본추출·비표본오차","short":"표본을 뽑는 방식의 차이와 조사 단계에서 발생하는 여러 오차를 구별합니다.","detail":"단순무작위는 개체가 같은 포함확률을 갖는 확률 표집의 대표 방식. 계통은 시작점을 무작위로 뽑고 일정 간격마다 추출. 층화는 동질적 층별로 표집, 집락은 집단을 먼저 선택한다. 표본오차는 표본이 달라져 생기는 변동, 비표본오차는 응답 거부·측정·기록·처리 등에서 생겨 전수조사에도 존재한다.","exam":"47회 25·27번: 계통추출은 모든 구간에서 따로 무작위 선택하지 않는다. 표본추출 개선으로 비표본오차가 자동 제거되지는 않는다.","example":"전국 학생 조사는 지역·학교별 층이나 집락을 구성해 비용을 줄이되 응답 누락을 따로 관리한다.","priority":"★★★"},{"parent":"앙상블","title":"보팅과 부스팅 가중치","short":"여러 모형의 예측을 합치는 법과 순차적으로 오답을 보완하는 법을 구분합니다.","detail":"배깅은 복원추출로 만든 표본에서 학습한 모형들을 병렬로 결합해 분산을 낮추는 데 도움이 된다. 보팅은 다수결·가중 다수결로 분류 결과를 합친다. 부스팅은 이전 모형의 오류를 다음 모형이 개선하도록 순차 학습한다. AdaBoost는 오분류 표본 가중치를 조절하며 Gradient Boosting은 손실의 음의 기울기를 따른다.","exam":"47회 42번: 부스팅이 모든 개별 모형에 동일 가중치를 준다는 보편적 설명은 틀림. 보팅은 배깅에만 한정되는 방법이 아니다.","example":"여러 나무의 다수결과, 앞선 오답을 집중 보완하는 연속 모델의 차이를 비교한다.","priority":"★★★"}]);

function connectionDropTarget(clientX,clientY,source){

 // Pointer capture can redirect pointer events, so never rely on event.target.

function mapConnection(from,to,container,variant,color){

  ? 'M '+fromEdge.x+' '+fromEdge.y+' C '+(fromEdge.x+Math.sign(dx)*bend)+' '+fromEdge.y+' '+(toEdge.x-Math.sign(dx)*bend)+' '+toEdge.y+' '+toEdge.x+' '+toEdge.y

const examOptionLessons={"SECI 지식경영":"48회 1번 · 선택지 판단\n공통화는 암묵→암묵, 표출화는 암묵→형식, 연결화는 형식→형식, 내면화는 형식→암묵이다. 연결화의 결과를 암묵지라고 하면 틀린다.","정성·정량":"48회 2번 · 선택지 판단\n정성: 범주·글·의미, 비정형 사례 많음. 정량: 수치·집계·통계 일반화에 유리. 분석 비용이 언제나 어느 한쪽에서 높다고 단정하지 않는다. 존재적 특성은 사실, 당위적 특성은 추론 근거.","데이터베이스":"48회 3번 · 선택지 판단\n공유·통합 저장, 중복 통제와 일관성은 데이터베이스의 특징. 독립성은 구조 변경 영향 최소화를 뜻하며 모든 변경에서 영향 0이라는 보장은 아니다. '구조가 없다'는 설명은 오답.","데이터베이스 4대 특성":"48회 4번 · 선택지 판단\n통합은 중복 통제, 저장은 컴퓨터 매체 기록, 공용은 여러 이용자 공유, 운영은 실제 업무 중 갱신을 의미한다. '고정되어 변경 불가'는 오답. 중복이 물리적으로 절대 0이라는 뜻은 아니다.","회귀분석":"48회 5번 · 선택지 판단\n설명변수 변화에 따른 수치형 결과변수의 평균적 변화·예측에는 회귀가 적절하다. 연관은 동시구매, 군집은 비슷한 대상 분류, 교차는 범주 간 빈도 비교. 회귀 결과만으로 인과를 확정하지 않는다.","빅데이터 위기":"48회 6번 · 선택지 판단\n사생활 침해·책임 원칙 훼손·데이터 오용은 위기. 익명화는 보호 수단, 알고리즘 점검·접근은 오용 대응 수단으로 구분한다. '동의→책임'은 법적 동의 의무 전면 폐지를 뜻하지 않는다.","빅데이터 활용 3요소":"48회 7번 · 선택지 판단\n교재 기준 기본 3요소는 데이터·기술·인력이다. 업무 프로세스는 실제 성공에 중요하지만 해당 3요소의 열거에는 들어가지 않는다.","데이터 사이언티스트의 역량":"48회 8번 · 선택지 판단\n통계·수학·모델 설계는 하드스킬. 시각화·설명·협업·도메인 통찰은 소프트스킬의 대표 내용. 알고리즘 피해 구제와 법적 조치는 별도 역할로 구분한다.","데이터 사이언스":"48회 9번 · 선택지 판단\n결측·이상값 처리, 예측·분류, EDA는 분석 과정에 포함된다. 알고리즘 이해·분석 기술을 소프트스킬이라고 하면 잘못된 분류다. 이상값을 무조건 삭제하는 것도 부정확하다.","빅데이터 3V·4V":"48회 10번 · 선택지 판단\n가치 패러다임은 Digitalization→Connection→Agency 순서. 먼저 디지털화, 다음 정보 연결, 그 뒤 지능적 대리 수행. 순서를 임의로 바꾸면 오답.","과제 발굴 방식":"48회 13번 · 선택지 판단\n상향식은 데이터에서 예상 못한 패턴 발견, 대표적으로 비지도학습. 비즈니스모델·외부 사례로 문제를 먼저 찾거나 명시적 가설을 검정하는 접근은 하향식 성격. 상향식이 비지도학습만으로 한정되는 것은 아니다.","CRISP-DM":"48회 12번 · 선택지 판단\n데이터 이해는 초기 수집·기술·탐색·품질 확인. 데이터 준비는 선택·정제·생성·통합·포맷팅. 실제 수행은 반복되지만 시험에서는 대표 활동의 귀속을 구분.","데이터 거버넌스":"48회 20번 · 선택지 판단\n거버넌스 3요소는 원칙·조직·프로세스. 표준 용어, 명명 규칙, 데이터 사전, 저장소 관리, 표준 준수 점검이 구성 활동. '데이터 운용 비용'을 표준 거버넌스 체계 항목과 혼동하지 않는다.","과제 우선순위":"48회 15번 · 선택지 판단\n시급성은 전략적 중요도·목표 가치·필요 시점, 난이도는 데이터 확보·처리 비용·기술 복잡도 등. 데이터의 양으로 시급성을 결정한다는 설명은 잘못된 축 혼동.","분석 성숙도":"48회 16번 · 선택지 판단\n성숙도 단계는 도입→활용→확산→최적화. 준비도×성숙도 사분면은 준비형·도입형·정착형·확산형. 목적은 조직의 현재 수준 진단과 개선이지 경쟁사와의 순위 대결 자체가 아니다.","분석 마스터플랜":"48회 17번 · 선택지 판단\n우선순위 결정: 전략 중요도·성과/ROI·실행 용이성. 적용 범위·방식 결정: 업무 내재화·분석 데이터·기술 적용 수준. '기술 적용 수준'을 우선순위 기준으로 바꾸는 보기 주의.","분석 준비도":"48회 18번 · 선택지 판단\n6개 진단 영역은 분석 업무·인력조직·기법·데이터·문화·IT 인프라. 비즈니스 성과는 준비도 6영역에 포함되지 않으며 성숙도 측면의 성과·활용과 구분.","분석 조직 유형":"48회 19번 · 선택지 판단\n집중형은 전사 조정에 유리하지만 현업과 중복 가능. 기능 중심형은 부서 내 독자 분석으로 전사 표준화가 어려울 수 있다. 분산형은 현업 신속 적용에 유리하나 조직별 수준 차이를 관리해야 한다."};

 const width=workspace.clientWidth;
 if(width<=830)return;

 });
 const stop=e=>{
  if(drag!==e.pointerId)return;drag=null;

 };

 });

}

const CLOUD_CONFIG='adsp-atlas-cloud-config-v1',CLOUD_DIRTY='adsp-atlas-cloud-dirty-v1',CLOUD_OWNER='adsp-atlas-cloud-owner-v1';

let cloudTimer=null,cloudBusy=false,cloudInitPromise=null,cloudConflictPending=false;
function cloudState(text,kind='offline'){
 const btn=el('cloudBtn');btn.dataset.kind=kind;el('cloudStatus').textContent=text;btn.title='동기화: '+text;
 const foot=document.querySelector('.footer-hint');if(foot)foot.textContent=cloudConfig?(kind==='online'?'이 PC와 클라우드에 저장됩니다.':kind==='warning'?'현재 PC에는 저장됨 · 클라우드 상태 확인 필요':'이 PC에 먼저 저장하고, 연결되면 동기화합니다.'):'개념은 이 PC에 먼저 저장됩니다. 클라우드는 상단에서 연결하세요.';
}
function cloudLocalLooksEdited(){
 try{const raw=localStorage.getItem(STORAGE);if(!raw)return false;const obj=JSON.parse(raw);return JSON.stringify({nodes:obj.nodes,links:obj.links})!==JSON.stringify({nodes:defaultNodes,links:defaultLinks})}catch(e){return false}
}
function currentSnapshot(){return {nodes:structuredClone(nodes),links:structuredClone(links)}}
function markClean(){cloudDirty=false;localStorage.removeItem(CLOUD_DIRTY)}
function applyCloud(doc){
 if(!doc||!Array.isArray(doc.nodes)||!Array.isArray(doc.links)||!doc.nodes.some(n=>n.id===root)||doc.nodes.length>1500)throw new Error('클라우드 데이터 형식이 올바르지 않습니다.');

}
async function cloudSDK(){
 if(window.supabase?.createClient)return window.supabase;
 if(!cloudInitPromise){cloudInitPromise=new Promise((resolve,reject)=>{const tag=document.createElement('script');tag.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';tag.onload=()=>window.supabase?.createClient?resolve(window.supabase):reject(Error('Supabase 라이브러리를 불러오지 못했습니다.'));tag.onerror=()=>reject(Error('인터넷 또는 CDN 연결을 확인하세요.'));document.head.append(tag)}).catch(e=>{cloudInitPromise=null;throw e})}
 return cloudInitPromise;
}
function validCloudConfig(o){try{const u=new URL(o.url);return u.protocol==='https:'&&/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(o.url)&&/^(sb_publishable_|eyJ)/.test(o.key)}catch(e){return false}}
function readCloudConfig(){try{const item=localStorage.getItem(CLOUD_CONFIG);return item?JSON.parse(item):{url:'https://mrljhjtcydjugiirmxxe.supabase.co',key:'sb_publishable_oqKw5IeOYCTS3h2WyYKiJw_6tn6-eer'}}catch(e){return {url:'https://mrljhjtcydjugiirmxxe.supabase.co',key:'sb_publishable_oqKw5IeOYCTS3h2WyYKiJw_6tn6-eer'}}}
async function cloudInit(){
 cloudConfig=readCloudConfig();cloudDirty=localStorage.getItem(CLOUD_DIRTY)==='1';
 if(!cloudConfig){cloudState('클라우드 설정');return}
 if(!validCloudConfig(cloudConfig)){cloudState('설정 확인 필요','warning');return}
 cloudState('연결 확인 중','busy');
 try{
  const sdk=await cloudSDK();
  cloudClient=sdk.createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true},global:{headers:{'X-Client-Info':'adsp-atlas/2'}}});
  cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT'){setTimeout(()=>onCloudAuth(session?.user||null),0)}});
  const {data,error}=await cloudClient.auth.getSession();if(error)throw error;
  await onCloudAuth(data.session?.user||null);
 }catch(e){cloudState('연결 실패 · 다시 시도','warning');console.warn('Supabase initialization failed',e)}
}
async function onCloudAuth(user){
 if(!user){cloudUser=null;cloudReady=false;cloudRevision=null;cloudState('이메일 인증 필요','warning');return}
 if(cloudUser?.id===user.id&&cloudReady)return;
 cloudUser=user;cloudReady=false;cloudRevision=null;
 const owner=localStorage.getItem(CLOUD_OWNER);
 if(owner&&owner!==user.id){nodes=structuredClone(defaultNodes);links=structuredClone(defaultLinks);focus=root;markClean();persistLocal(false);renderMap();renderDetail()}
 localStorage.setItem(CLOUD_OWNER,user.id);
 cloudState('학습 내용 불러오는 중','busy');await cloudPull(true);
}
async function cloudPull(initial=false){
 if(!cloudClient||!cloudUser||cloudBusy)return;
 cloudBusy=true;
 try{
  const {data,error}=await cloudClient.from('atlas_documents').select('payload,revision').eq('user_id',cloudUser.id).maybeSingle();
  if(error)throw error;
  if(!cloudUser){return}
  const serverRev=data?.revision??null;
  if(initial){
    cloudRevision=serverRev;
    if(data&&cloudDirty){cloudBusy=false;cloudConflict(data.payload,serverRev);return}
    if(data){applyCloud(data.payload);cloudReady=true;cloudState('자동 동기화 완료','online');}
    else {cloudReady=true;cloudState('최초 업로드 중','busy');if(!cloudDirty){cloudDirty=true;localStorage.setItem(CLOUD_DIRTY,'1')}cloudBusy=false;await cloudPush();return}
  }else if(data&&serverRev!==cloudRevision){
    if(cloudDirty){cloudBusy=false;cloudConflict(data.payload,serverRev);return}
    cloudRevision=serverRev;applyCloud(data.payload);cloudState('다른 기기 변경 반영','online');
  }else if(!cloudDirty){cloudState('자동 동기화 완료','online')}
 }catch(e){console.warn('Cloud read failed',e);cloudState('PC에 저장됨 · 동기화 오류','warning')}
 finally{cloudBusy=false}
}
function cloudConflict(remoteDoc,remoteRev){
 cloudReady=false;cloudConflictPending=true;cloudState('저장 내용 선택 필요','warning');
 const d=mountDialog('어느 학습 내용을 사용할까요?','이 PC의 수정 내용과 클라우드 내용이 모두 있습니다. 자동으로 덮어쓰지 않았습니다.');
 const hint=document.createElement('div');hint.className='cloud-note';hint.textContent='먼저 JSON 백업을 권장합니다. 집·강의실에서 동시에 수정했다면 한쪽을 선택하면 다른 쪽 변경사항이 덮어써질 수 있습니다.';d.body.append(hint);
 const actions=document.createElement('div');actions.className='cloud-actions';
 const backup=document.createElement('button');backup.textContent='① 현재 PC JSON 백업';backup.onclick=()=>{download('ADsP_ATLAS_충돌전_백업.json',JSON.stringify({nodes,links,exportedAt:new Date().toISOString()},null,2),'application/json');toast('현재 PC 학습 내용을 백업했습니다.')};
 const take=document.createElement('button');take.textContent='② 클라우드 내용 불러오기';take.onclick=()=>{try{applyCloud(remoteDoc);cloudRevision=remoteRev;cloudReady=true;cloudConflictPending=false;closeModal();cloudState('클라우드 내용 적용','online')}catch(e){toast(e.message)}};
 const push=document.createElement('button');push.className='primary';push.textContent='③ 현재 PC 내용을 업로드';push.onclick=async()=>{if(!confirm('클라우드의 기존 내용을 이 PC 내용으로 교체하시겠습니까? 다른 기기의 미반영 수정 내용이 사라질 수 있습니다.'))return;cloudRevision=remoteRev;cloudReady=true;cloudConflictPending=false;closeModal();await cloudPush()};
 actions.append(backup,take,push);d.body.append(actions);d.actions.style.display='none';
}
function scheduleCloudSave(){
 clearTimeout(cloudTimer);
 if(!cloudConfig)return;
 if(!cloudClient||!cloudUser||!cloudReady){cloudState('이 PC에 저장 · 연결 대기','warning');return}
 cloudState('클라우드 저장 대기','busy');cloudTimer=setTimeout(()=>{cloudPush()},650);
}
async function cloudPush(){
 if(!cloudReady||!cloudClient||!cloudUser||cloudBusy||!cloudDirty)return;
 cloudBusy=true;const snap=currentSnapshot();const before=JSON.stringify(snap);const rev=cloudRevision;
 cloudState('클라우드 저장 중','busy');
 try{
  let data,error;
  if(rev===null){({data,error}=await cloudClient.from('atlas_documents').insert({user_id:cloudUser.id,payload:snap,revision:1}).select('revision').single());}
  else {({data,error}=await cloudClient.from('atlas_documents').update({payload:snap,revision:Number(rev)+1}).eq('user_id',cloudUser.id).eq('revision',rev).select('revision').maybeSingle());}
  if(error)throw error;
  if(!data){cloudReady=false;cloudState('다른 기기 변경 감지','warning');cloudBusy=false;await cloudPull(true);return}
  cloudRevision=data.revision;
  if(JSON.stringify(currentSnapshot())===before){markClean();cloudState('자동 동기화 완료','online')}
  else {cloudState('후속 변경 저장 중','busy');cloudBusy=false;scheduleCloudSave()}
 }catch(e){console.warn('Cloud save failed',e);cloudState('PC에 저장됨 · 동기화 실패','warning')}
 finally{cloudBusy=false}
}
async function cloudRefresh(){if(!cloudUser||!cloudReady||cloudBusy)return;if(cloudDirty){await cloudPush()}else if(el('modal').classList.contains('hidden')){await cloudPull(false)}}

  const help=document.createElement('div');help.className='cloud-note';help.textContent='1. Supabase에서 무료 프로젝트 생성 → 2. 제공한 atlas_setup.sql 실행 → 3. 이 화면에 Project URL과 Publishable key 입력 → 4. 이메일 인증. GitHub Pages 배포 주소를 Authentication의 URL 설정에 등록하세요.';d.body.append(help);
  d.actions.append(cloudAction('닫기',closeModal),cloudAction('연결 저장',()=>{const cfg={url:url.value.trim().replace(/\/$/,''),key:key.value.trim()};if(!validCloudConfig(cfg)){toast('올바른 Supabase URL과 공개 키를 입력하세요.');return}if(cloudClient&&cloudUser){toast('다른 프로젝트로 바꾸려면 먼저 로그아웃하세요.');return}localStorage.setItem(CLOUD_CONFIG,JSON.stringify(cfg));closeModal();cloudClient=null;cloudInit()},'primary'));
  return;

 const d=mountDialog('클라우드 동기화',cloudUser?'로그인 상태가 이 브라우저에 보존됩니다.':'처음에 이메일로 인증하면 이후 자동 로그인됩니다.');
 const status=document.createElement('div');status.className='cloud-note';status.textContent=cloudUser?`연결 계정: ${cloudUser.email||cloudUser.id}\n상태: ${el('cloudStatus').textContent}`:'이메일로 일회용 로그인 링크를 보냅니다. 링크를 이 브라우저에서 열어주세요.';status.style.whiteSpace='pre-line';d.body.append(status);
 if(!cloudUser){
  const email=document.createElement('input');email.className='cloud-input';email.type='email';email.autocomplete='email';email.placeholder='example@gmail.com';d.body.append(cloudRow('이메일 주소',email));
  const warn=document.createElement('div');warn.className='cloud-note';warn.textContent='반드시 GitHub Pages 같은 HTTPS 주소에서 사용하세요. Supabase Authentication → URL Configuration에 웹사이트 주소를 등록해야 인증 링크가 돌아옵니다.';d.body.append(warn);
  d.actions.append(cloudAction('설정 수정',()=>{localStorage.removeItem(CLOUD_CONFIG);cloudConfig=null;cloudClient=null;cloudReady=false;closeModal();openCloud()}),cloudAction('닫기',closeModal),cloudAction('인증 메일 보내기',async()=>{
    if(!email.validity.valid||!email.value.trim()){toast('이메일 주소를 확인하세요.');return}

  },'primary'));
 }else{

  d.actions.append(cloudAction('닫기',closeModal),cloudAction('지금 동기화',async()=>{closeModal();if(!cloudReady)await cloudPull(true);else if(cloudDirty)await cloudPush();else await cloudPull(false);toast(el('cloudStatus').textContent)},'primary'),cloudAction('로그아웃',async()=>{

    const {error}=await cloudClient.auth.signOut();if(error){toast(error.message);return}closeModal();cloudUser=null;cloudReady=false;cloudRevision=null;nodes=structuredClone(defaultNodes);links=structuredClone(defaultLinks);focus=root;markClean();localStorage.removeItem(CLOUD_OWNER);persistLocal(false);renderMap();renderDetail();cloudState('이메일 인증 필요','warning');

 }
