<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>ADsP ATLAS — 개념을 연결하는 나만의 교재</title>
<link rel="stylesheet" href="assets/atlas.css?v=20261020-graphite-v4">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-icon">✧</div><div><div class="brand-main">ADsP ATLAS</div><div class="brand-sub">LEARN BY CONNECTION</div></div></div>
    <nav class="crumb" id="crumb" aria-label="현재 위치"></nav>
    <div class="top-actions">
      <button class="cloud-state" id="cloudBtn" data-kind="offline" title="클라우드 동기화 상태"><span class="cloud-indicator"></span><span id="cloudStatus">클라우드 설정</span></button>
      <button class="top-action" id="homeBtn" title="모든 개념 펼쳐보기">⌂ <span>전체 지도</span></button>
      <button class="top-action" id="searchBtn" title="개념 검색 (/)" aria-label="검색">⌕ <span>개념 검색</span></button>
      <button class="top-action" id="dataBtn" title="백업 및 불러오기">⇪ <span>내 데이터</span></button>
      <button class="top-action primary" id="topAddBtn" title="하위 개념 추가">＋ <span>개념 추가</span></button>
    </div>
  </header>
  <main class="workspace">
    <section class="map-area" id="mapArea" aria-label="개념 마인드맵">
      <button class="mobile-detail-toggle" id="mobilePanelBtn">☰ 개념 설명</button>
      <div class="map-camera" id="mapCamera"><div class="map-viewport" id="viewport"><svg class="orbit-layer" id="orbits" aria-hidden="true"></svg><svg class="edge-layer" id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div>
      <div class="map-controls" role="group" aria-label="마인드맵 확대 축소">
        <button id="zoomInBtn" type="button" aria-label="지도 확대" title="확대">＋</button>
        <button id="zoomResetBtn" type="button" aria-label="원래 크기로 돌아가기" title="원래 크기로" class="zoom-level"><span id="zoomLevel">100%</span></button>
        <button id="zoomOutBtn" type="button" aria-label="지도 축소" title="축소">－</button>
      </div>
      <div class="legend"><span><i class="legend-dot" style="--dot:#57dbc3"></i>데이터 이해</span><span><i class="legend-dot" style="--dot:#f4ad78"></i>분석 기획</span><span><i class="legend-dot" style="--dot:#ae9bff"></i>데이터 분석</span></div>
      
    </section>
    <aside class="detail" id="detail" aria-label="개념 설명 패널">
      <div class="detail-header" id="detailHeader"></div>
      <div class="detail-scroll" id="detailScroll"></div>
      <div class="detail-footer"><button class="full-add" id="childAddBtn">＋ 이 개념 아래에 추가</button><div class="footer-hint">개념은 이 PC에 먼저 저장되며, 클라우드를 연결하면 동기화됩니다.</div></div>
    </aside>
  </main>
</div>
<div id="modal" class="overlay hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status"></div>
<script src="assets/atlas.js?v=20261020-study-v2"></script>
</body>
</html>
